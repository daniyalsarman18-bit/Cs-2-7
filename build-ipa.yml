name: Build Demo IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '**.swift'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Find project and scheme
        id: project
        shell: bash
        run: |
          PROJECT=$(find . -maxdepth 2 -name '*.xcodeproj' -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "No .xcodeproj was generated. Check project.yml."
            exit 1
          fi

          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          projects = data.get("project", {})
          schemes = projects.get("schemes", [])
          if not schemes:
              raise SystemExit("No Xcode scheme found.")
          print(schemes[0])
          ')

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project "${{ steps.project.outputs.project }}" \
            -scheme "${{ steps.project.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "Build succeeded but no .app was found."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r DemoApp-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemoApp-unsigned-IPA
          path: DemoApp-unsigned.ipa
          if-no-files-found: error
